<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kinetix - Mobile-First Premium Fitness Experience">
  <title>Kinetix Fitness</title>

  <!-- Google Font: Inter for modern sans-serif typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Master Design System Stylesheet -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Global Modals & Overlays Backdrops -->
  <div id="modal-backdrop" class="overlay-backdrop" aria-hidden="true"></div>

  <div class="desktop-layout">

    <!-- Desktop Sidebar Navigation (Visible at >=1024px) -->
    <aside class="desktop-sidebar" aria-label="Desktop Navigation">
      <div class="desktop-brand-header">
        <div class="desktop-brand-icon">
          K
        </div>
        <span class="desktop-brand-text">KINETIX</span>
        <span class="badge badge-primary desktop-brand-badge">PRO</span>
      </div>

      <nav class="desktop-nav-list">
        <a href="#home" class="desktop-nav-item is-active" id="desk-nav-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Home</span>
        </a>
        <a href="#workouts" class="desktop-nav-item" id="desk-nav-workouts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Workouts</span>
        </a>
        <a href="#plans" class="desktop-nav-item" id="desk-nav-plans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span>Plans</span>
        </a>
        <a href="#progress" class="desktop-nav-item" id="desk-nav-progress">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Progress</span>
        </a>
        <a href="#profile" class="desktop-nav-item" id="desk-nav-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </a>
      </nav>

      <!-- Mini Athlete Profile at bottom of sidebar -->
      <div class="desktop-user-footer">
        <div class="desktop-user-avatar">
          AM
        </div>
        <div class="desktop-user-info">
          <div class="text-label desktop-user-name">Alex Morgan</div>
          <div class="text-caption text-secondary">Pro Athlete</div>
        </div>
      </div>
    </aside>

    <!-- Main Application Shell & Views Container -->
    <div class="desktop-main app-shell">

      <!-- Top Bar Header (Sticky, Glassmorphic) -->
      <header class="top-bar">
        <button class="top-bar-action top-bar-back-hidden" id="top-bar-back-btn" aria-label="Go back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="top-bar-title" id="top-bar-title-text">
          <span class="top-bar-brand-title">KINETIX</span>
        </div>

        <button class="top-bar-action" id="top-bar-action-btn" aria-label="Quick Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
      </header>

      <!-- Dynamic View Injection Area -->
      <main id="app-view" class="container app-view-container" role="main">
        <!-- Views dynamically rendered here by Router -->
      </main>

      <!-- Mobile Bottom Navigation (Visible at <1024px) -->
      <nav class="bottom-nav" aria-label="Primary Navigation">
        <a href="#home" class="bottom-nav-item is-active" id="nav-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Home</span>
        </a>
        <a href="#workouts" class="bottom-nav-item" id="nav-workouts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span>Workouts</span>
        </a>
        <a href="#plans" class="bottom-nav-item" id="nav-plans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span>Plans</span>
        </a>
        <a href="#progress" class="bottom-nav-item" id="nav-progress">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Progress</span>
        </a>
        <a href="#profile" class="bottom-nav-item" id="nav-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profile</span>
        </a>
      </nav>

    </div>

  </div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
